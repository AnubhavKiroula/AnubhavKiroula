name: Generate Snake Contribution Graph

on:
  schedule:
    # every hour
    - cron: "0 * * * *"
  
  # allows to manually run the job at any time
  workflow_dispatch:
  
  # run on every push on the master/main branch
  push:
    branches:
    - main
    - master

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Generate contributions.json
        run: |
          python -c "
          import urllib.request, json, os
          try:
              req = urllib.request.Request('https://github-contributions-api.jogruber.de/v4/AnubhavKiroula?format=nested', headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=10) as response:
                  data = json.loads(response.read().decode())
              totals = data.get('total', {})
              total_all_years = sum(totals.values())
              contributions_2026 = totals.get('2026', 0)
              output_data = {'total': total_all_years, '2026': contributions_2026, '2025': totals.get('2025', 0)}
              os.makedirs('dist', exist_ok=True)
              with open('dist/contributions.json', 'w') as f:
                  json.dump(output_data, f)
              print('Successfully generated contributions.json:', output_data)
          except Exception as e:
              print('Error generating contributions.json:', e)
              os.makedirs('dist', exist_ok=True)
              with open('dist/contributions.json', 'w') as f:
                  json.dump({'total': 0, '2026': 0, '2025': 0}, f)
          "
          
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
